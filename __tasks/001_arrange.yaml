directory: ~/workspace/for-mywork/__workspace
model: sonnet

prompt: |
  インプット：「.\__workspace\input\修正したい箇所.md」
  インプットをすべて読んでください。
  まず改善要望の本質を理解し、後続のAIが認識の齟齬を起こさないように不足情報の追加や表現方法の修正を行い、問題を整理して。
  目的は実装ではなく、問題の理解・分類と依存関係の整理です。
  整理結果をリポジトリ単位でpreIssueに起こし、各preIssueについて以下を抽出してください。出力先は「.\__workspace\output\project\plans」。命名規則は「preIssue-XXX.md」。XXXはリポジトリ名。

  - ID
  - 問題の要約
  - 対象リポジトリ（ライブラリ）
  - 対象機能
  - 明示されている期待動作
  - 現在の問題
  - 他Issueとの関連
  - 他リポジトリとの関連
  - 調査が必要な点
  - 実装が必要な点
  - 難易度：低 / 中 / 高 / 不明

  推測で原因を決めないでください。
  情報が不足している場合は「不明」としてください。

  まだコードの修正はしないでください。