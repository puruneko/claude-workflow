directory: ~/workspace/for-mywork/__workspace
model: sonnet

prompt: |
  各preIssueについて、調査してください。preIssueの格納場所は「.\__workspace\output\project\plans」。命名規則は「preIssue-XXX.md」。XXXはリポジトリ名。

  まだコード変更はしないでください。

  目的：
  このpreIssueの原因を特定するために、対象リポジトリの実装を調査する。この調査結果は別のAIのインプットとなり、そのAIがリポジトリ全体を読まなくても原因分析できるようになることを期待する。

  調査してほしいもの：
  - 関連する主要ファイル
  - 関連する関数・コンポーネント
  - データフロー
  - 状態管理
  - 外部とのインターフェース
  - テスト
  - 関連する設定

  以下をレポートしてください。

  1. 現在の実装
  2. Issueの症状が発生する経路
  3. 確認できた事実
  4. 推測
  5. 根本原因の候補
  6. 追加調査が必要な点
  7. 修正する場合に影響を受ける範囲

  レポート結果は以下に作成してください。
  「.\__workspace\output\project\plans」。命名規則は「survey-XXX.md」。XXXはリポジトリ名。
  複数のリポジトリにまたがる問題の場合は、より根本原因となりうるリポジトリに追記してください。

  コードを書き換えないでください。
  必要なファイルだけ調査し、関係のないファイルを大量に読み込まないでください。
  元のインプット：「.\__workspace\input\修正したい箇所.md」